server:
  port: 8080

spring:
  application:
    name: taskflow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    # 下划线转驼峰：数据库 user_name -> Java 字段 userName
    map-underscore-to-camel-case: true
    # 开发期在控制台打印 SQL，上线前移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 自定义 JWT 配置，由 security 包下的配置类读取
# 生产环境务必通过环境变量注入，不要把真实值写进这个文件
jwt:
  # HS256 密钥，至少 32 字节。通过环境变量 JWT_SECRET 注入
  secret: ${JWT_SECRET:}
  # access token 过期时间，单位毫秒，默认 30 分钟
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  # refresh token 过期时间，单位毫秒，默认 7 天
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
